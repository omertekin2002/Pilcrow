name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pilcrow
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the console script
        run: pilcrow --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pilcrow with pinned lint and type-check tools
        run: python -m pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy (strict)
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/pilcrow" --help
          "$RUNNER_TEMP/wheel-env/bin/pilcrow" --version

  # Self-test the composite action (action.yml) and the pre-commit hook
  # (.pre-commit-hooks.yaml) against a generated document repository.
  enforce:
    runs-on: ubuntu-latest
    env:
      FIXTURE: ${{ github.workspace }}/../pilcrow-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pilcrow and pre-commit
        run: python -m pip install . pre-commit==4.7.0

      - name: Build a fixture repository with fresh companions
        run: python scripts/make_fixture_repo.py "$FIXTURE"

      - name: Action passes when companions are fresh
        uses: ./
        with:
          root: ../pilcrow-fixture

      - name: Hook passes when companions are fresh
        working-directory: ${{ env.FIXTURE }}
        run: |
          pre-commit try-repo "$GITHUB_WORKSPACE" pilcrow-check --all-files --verbose | tee "$RUNNER_TEMP/hook-fresh.log"
          grep -E '^pilcrow check\.+Passed$' "$RUNNER_TEMP/hook-fresh.log"

      - name: Edit the DOCX without re-exporting
        run: python scripts/make_fixture_repo.py "$FIXTURE" --stale

      - name: Action runs against stale companions (expected to fail)
        id: stale-action
        continue-on-error: true
        uses: ./
        with:
          root: ../pilcrow-fixture

      - name: Action failed on stale companions
        env:
          OUTCOME: ${{ steps.stale-action.outcome }}
        run: |
          echo "stale action outcome: $OUTCOME"
          test "$OUTCOME" = failure

      - name: Hook fails when companions are stale
        working-directory: ${{ env.FIXTURE }}
        run: |
          if pre-commit try-repo "$GITHUB_WORKSPACE" pilcrow-check --all-files --verbose > "$RUNNER_TEMP/hook-stale.log" 2>&1; then
            cat "$RUNNER_TEMP/hook-stale.log"
            echo "::error::pilcrow-check passed on stale companions"
            exit 1
          fi
          cat "$RUNNER_TEMP/hook-stale.log"
          grep -E '^pilcrow check\.+Failed$' "$RUNNER_TEMP/hook-stale.log"
          grep 'stale' "$RUNNER_TEMP/hook-stale.log"
