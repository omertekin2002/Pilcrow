name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pilcrow
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the console script
        run: pilcrow --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pilcrow with pinned lint and type-check tools
        run: python -m pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy (strict)
        run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/pilcrow" --help
          "$RUNNER_TEMP/wheel-env/bin/pilcrow" --version

  # Self-test the composite action (action.yml) and the pre-commit hook
  # (.pre-commit-hooks.yaml) against a generated document repository.
  enforce:
    runs-on: ubuntu-latest
    env:
      FIXTURE: ${{ github.workspace }}/../pilcrow-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pilcrow and pre-commit
        run: python -m pip install . pre-commit==4.7.0

      - name: Build a fixture repository with fresh companions
        run: python scripts/make_fixture_repo.py "$FIXTURE"

      - name: Action passes when companions are fresh
        id: fresh-action
        uses: ./
        with:
          root: ../pilcrow-fixture

      - name: Without the summary input, no summary is written
        env:
          SUMMARY_FILE: ${{ steps.fresh-action.outputs.summary-file }}
        run: test -z "$SUMMARY_FILE"

      - name: Hook passes when companions are fresh
        working-directory: ${{ env.FIXTURE }}
        run: |
          pre-commit try-repo "$GITHUB_WORKSPACE" pilcrow-check --all-files --verbose | tee "$RUNNER_TEMP/hook-fresh.log"
          grep -E '^pilcrow check\.+Passed$' "$RUNNER_TEMP/hook-fresh.log"

      - name: Edit the DOCX without re-exporting
        run: python scripts/make_fixture_repo.py "$FIXTURE" --stale

      - name: Action runs against stale companions (expected to fail)
        id: stale-action
        continue-on-error: true
        uses: ./
        with:
          root: ../pilcrow-fixture

      - name: Action failed on stale companions
        env:
          OUTCOME: ${{ steps.stale-action.outcome }}
        run: |
          echo "stale action outcome: $OUTCOME"
          test "$OUTCOME" = failure

      - name: Hook fails when companions are stale
        working-directory: ${{ env.FIXTURE }}
        run: |
          if pre-commit try-repo "$GITHUB_WORKSPACE" pilcrow-check --all-files --verbose > "$RUNNER_TEMP/hook-stale.log" 2>&1; then
            cat "$RUNNER_TEMP/hook-stale.log"
            echo "::error::pilcrow-check passed on stale companions"
            exit 1
          fi
          cat "$RUNNER_TEMP/hook-stale.log"
          grep -E '^pilcrow check\.+Failed$' "$RUNNER_TEMP/hook-stale.log"
          grep 'STALE' "$RUNNER_TEMP/hook-stale.log"

      # The opt-in job summary (summary: outline|full) on a stale fixture: the summary
      # still runs, and the action still fails with the check's exit code.
      - name: Action writes a summary even when the check fails (expected to fail)
        id: stale-summary
        continue-on-error: true
        uses: ./
        with:
          root: ../pilcrow-fixture
          summary: outline
          base: HEAD

      - name: Stale action failed and still wrote a summary
        env:
          OUTCOME: ${{ steps.stale-summary.outcome }}
          SUMMARY_FILE: ${{ steps.stale-summary.outputs.summary-file }}
        run: |
          echo "stale summary action outcome: $OUTCOME"
          test "$OUTCOME" = failure
          cat "$SUMMARY_FILE"
          grep -F 'No DOCX documents changed.' "$SUMMARY_FILE"

      - name: Commit an edited, re-exported DOCX on top of the fresh commit
        id: edit
        run: |
          git -C "$FIXTURE" reset --quiet --hard
          python scripts/make_fixture_repo.py "$FIXTURE" --commit
          echo "base=$(git -C "$FIXTURE" rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Action writes a full summary
        id: full-summary
        uses: ./
        with:
          root: ../pilcrow-fixture
          summary: full
          base: ${{ steps.edit.outputs.base }}

      - name: Full summary has the document's report
        env:
          SUMMARY_FILE: ${{ steps.full-summary.outputs.summary-file }}
        run: |
          cat "$SUMMARY_FILE"
          grep -E '^## Review: `[0-9a-f]+:report\.docx` → `[0-9a-f]+:report\.docx`$' "$SUMMARY_FILE"
          grep -Fx '### Prose' "$SUMMARY_FILE"
          grep -F 'now says something else' "$SUMMARY_FILE"

      - name: Action writes an outline summary
        id: outline-summary
        uses: ./
        with:
          root: ../pilcrow-fixture
          summary: outline
          base: ${{ steps.edit.outputs.base }}

      - name: Outline summary has no document text
        env:
          SUMMARY_FILE: ${{ steps.outline-summary.outputs.summary-file }}
        run: |
          cat "$SUMMARY_FILE"
          grep -F '`report.docx` — changed: Prose changed' "$SUMMARY_FILE"
          if grep -F -e 'now says something else' -e 'says one thing' "$SUMMARY_FILE"; then
            echo "::error::the outline summary published document text"
            exit 1
          fi
