name: Release and publish

on:
  push:
    branches: [main]

concurrency:
  group: pilcrow-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          # A queued run must include version commits from earlier releases.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Bump patch version
        id: version
        run: |
          version=$(python scripts/bump_version.py)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test the release package
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
          test "$(pilcrow --version)" = "${RELEASE_TAG#v}"

      - name: Commit and tag release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/pilcrow/__init__.py
          git commit -m "chore(release): $RELEASE_TAG [skip ci]"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          # If main advanced during the build, fail before publishing anything.
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
