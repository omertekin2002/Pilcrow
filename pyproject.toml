[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilcrow-docx"
version = "0.1.0"
description = "Readable DOCX companion diffs for ordinary Git workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7.1,<1"]

[project.scripts]
pilcrow = "pilcrow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
