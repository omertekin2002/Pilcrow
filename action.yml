name: Pilcrow check
description: Fail when DOCX review companions are missing, stale or orphaned (runs `pilcrow check --all`).
author: omertekin2002

inputs:
  root:
    description: Document repository root to check, relative to the workspace (the `--root` option).
    required: false
    default: "."
  python-version:
    description: Python version used to run Pilcrow (3.10 or later).
    required: false
    default: "3.12"
  summary:
    description: >-
      Write a review of each changed DOCX to the job summary: "none" (no summary),
      "outline" (paths, statuses and which report sections changed; no document text) or
      "full" (each document's `pilcrow review --format markdown` report, which includes
      document text visible to anyone who can view the workflow run).
    required: false
    default: "none"
  base:
    description: >-
      Revision to compare from when `summary` is set; the new side is always HEAD.
      The checkout must include it (for example `fetch-depth: 0` on actions/checkout).
    required: false
    default: ${{ github.event.pull_request.base.sha || github.event.before }}

outputs:
  summary-file:
    description: Path of the Markdown summary file, when `summary` is set (also appended to the job summary).
    value: ${{ steps.summary.outputs.file }}

runs:
  using: composite
  steps:
    # update-environment: false keeps this Python off the caller's PATH, so later
    # steps in the caller's job see the environment they set up themselves.
    - id: python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false

    # Install from this action's own checkout, so `uses: omertekin2002/Pilcrow@<tag>`
    # runs exactly that tag's code, into a private virtual environment.
    - id: install
      name: Install Pilcrow
      shell: bash
      env:
        PILCROW_PYTHON: ${{ steps.python.outputs.python-path }}
        PILCROW_SOURCE: ${{ github.action_path }}
        PILCROW_VENV: ${{ runner.temp }}/pilcrow-action-venv
      run: |
        "$PILCROW_PYTHON" -m venv --clear "$PILCROW_VENV"
        if [ -x "$PILCROW_VENV/bin/python" ]; then
          venv_python="$PILCROW_VENV/bin/python"
        else
          venv_python="$PILCROW_VENV/Scripts/python.exe"
        fi
        "$venv_python" -m pip install --quiet --disable-pip-version-check "$PILCROW_SOURCE"
        echo "python=$venv_python" >> "$GITHUB_OUTPUT"

    # Exit code is Pilcrow's: 1 for missing/stale/orphan companions, 2 for errors.
    - name: Check companions
      shell: bash
      env:
        PILCROW_PYTHON: ${{ steps.install.outputs.python }}
        PILCROW_ROOT: ${{ inputs.root }}
      run: '"$PILCROW_PYTHON" -m pilcrow check --all --root "$PILCROW_ROOT"'

    # Runs after a failed check too; the action's outcome stays the check's. Problems with the
    # base or a document become a warning in the summary, never a failure.
    - id: summary
      name: Summarize changed documents
      if: always() && steps.install.outcome == 'success' && inputs.summary != 'none' && inputs.summary != ''
      shell: bash
      env:
        PILCROW_PYTHON: ${{ steps.install.outputs.python }}
        PILCROW_ROOT: ${{ inputs.root }}
        PILCROW_BASE: ${{ inputs.base }}
        PILCROW_MODE: ${{ inputs.summary }}
      run: |
        mode=$(printf '%s' "$PILCROW_MODE" | tr '[:upper:]' '[:lower:]')
        case "$mode" in
          outline|full) ;;
          *) echo "::error::summary must be none, outline or full, not '$PILCROW_MODE'"; exit 2 ;;
        esac
        file="$RUNNER_TEMP/pilcrow-summary-$$-$RANDOM.md"
        # "--option=value", so a value that starts with "-" is not read as an option.
        if "$PILCROW_PYTHON" -m pilcrow.summary --base="$PILCROW_BASE" --root="$PILCROW_ROOT" --mode="$mode" --output="$file"; then
          cat "$file" >> "$GITHUB_STEP_SUMMARY"
          echo "file=$file" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Pilcrow could not write the job summary (exit code $?); the check result is unaffected."
        fi
